<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 타로 & 운세 마스터</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔮 AI 타로 & 운세 종합 리딩</h1>
            <p>당신의 고민을 담아 질문을 전달하면, 타로와 사주 운세를 종합하여 신비로운 조언을 전해드립니다.</p>
        </header>

        <main>
            <form id="fortuneForm">
                <!-- 1. 기본 정보 입력 -->
                <section class="form-group">
                    <label for="userName">이름 또는 닉네임 <span class="required">*</span></label>
                    <input type="text" id="userName" name="userName" placeholder="예: 홍길동" required>
                </section>

                <section class="form-group">
                    <label for="birthInfo">생년월일 및 태어난 시 (선택)</label>
                    <input type="text" id="birthInfo" name="birthInfo" placeholder="예: 1998년 5월 12일 오전 8시 (양력)">
                </section>

                <!-- 2. 옵션 선택 -->
                <div class="form-row">
                    <section class="form-group half">
                        <label for="toneSelect">해석 톤앤매너</label>
                        <select id="toneSelect" name="toneSelect">
                            <option value="신비롭고 다정한">🔮 신비롭고 다정한</option>
                            <option value="냉철하고 직설적인">⚔️ 냉철하고 직설적인</option>
                            <option value="따뜻하고 위로가 되는">🌿 따뜻하고 위로가 되는</option>
                            <option value="진지하고 철학적인">📜 진지하고 철학적인</option>
                        </select>
                    </section>

                    <section class="form-group half">
                        <label for="promptType">리딩 깊이 (프롬프트 선택)</label>
                        <select id="promptType" name="promptType">
                            <option value="A">Prompt A (기본 종합 분석)</option>
                            <option value="B">Prompt B (전문가 심층 분석)</option>
                        </select>
                    </section>
                </div>

                <section class="form-group checkbox-group">
                    <label>
                        <input type="checkbox" id="useSearch" name="useSearch">
                        <span>🔍 Serper 웹 검색 연동 (최신 운세 정보 참고)</span>
                    </label>
                </section>

                <!-- 3. 타로 카드 선택 영역 (새로고침/셔플 시 랜덤 생성) -->
                <section class="form-group tarot-section">
                    <div class="tarot-header-wrap">
                        <div>
                            <label class="tarot-main-label">🃏 오늘의 운명 타로 카드 (3장 스프레드)</label>
                            <p class="section-desc">카드를 클릭하여 뒤집어보세요. 당신의 과거, 현재, 미래의 기운이 담깁니다.</p>
                        </div>
                        <div class="tarot-action-buttons">
                            <button type="button" id="shuffleCardsBtn" class="btn-sm">🔀 다시 섞기</button>
                            <button type="button" id="flipAllCardsBtn" class="btn-sm">✨ 모두 확인</button>
                        </div>
                    </div>

                    <div id="tarotCardsContainer" class="tarot-cards-grid">
                        <!-- JS에서 동적으로 3장의 카드 렌더링 -->
                    </div>
                    <div id="tarotStatus" class="tarot-status">카드를 클릭하여 뒤집어주세요.</div>
                </section>

                <!-- 4. 질문 입력 영역 (최대 10개) -->
                <section class="form-group">
                    <div class="section-title-wrap">
                        <label>고민 및 질문 목록 <span class="required">*</span> (최대 10개)</label>
                        <span id="questionCount" class="count-badge">1 / 10</span>
                    </div>
                    
                    <div id="questionsContainer">
                        <div class="question-input-row">
                            <input type="text" class="question-input" placeholder="질문 1: 올해 나의 전반적인 운세 흐름은 어떤가요?" required>
                        </div>
                    </div>

                    <button type="button" id="addQuestionBtn" class="btn-secondary">+ 질문 추가하기</button>
                </section>

                <!-- 에러 메시지 영역 (폼 내부로 이동하여 화면 점프 방지) -->
                <div id="errorMessage" class="error-box hidden"></div>

                <button type="submit" id="submitBtn" class="btn-primary">✨ 운세 & 타로 보기</button>
            </form>

            <!-- 로딩 화면 -->
            <div id="loading" class="loading-container hidden">
                <div class="spinner"></div>
                <p>운세의 흐름과 타로 카드의 상징을 읽어내고 있습니다...</p>
            </div>

            <!-- 결과 출력 영역 -->
            <section id="resultContainer" class="result-box hidden">
                <h2>🔮 운세 & 타로 리딩 결과</h2>
                <div id="resultContent" class="markdown-body"></div>
                
                <div class="button-group">
                    <button type="button" id="copyBtn" class="btn-outline">📋 결과 복사</button>
                    <button type="button" id="downloadBtn" class="btn-outline">📥 Markdown 다운로드</button>
                </div>
            </section>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.min.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
